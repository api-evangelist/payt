aid: payt
name: Payt
description: >-
  Payt (Payt B.V.) is a Netherlands-based accounts receivable management platform that automates
  invoice follow-up and payment collection while keeping personal contact with customers. It syncs
  invoices and debtor data from accounting and ERP systems, then runs the collections workflow:
  automated reminders, flexible payment plans, debt-collection cases, creditworthiness checks,
  electronic (UBL/Peppol) invoicing, a self-service debtor portal, and payment reconciliation.
  Payt exposes a REST Customer API (api.paytsoftware.com, v1) with OAuth 2.0 authorization, cursor
  pagination and incremental sync, a rich signed-webhook event surface, and bulk CSV/XML/JSON imports.
  Surfaced as a portfolio company of Partech and enriched into the API Evangelist network.
